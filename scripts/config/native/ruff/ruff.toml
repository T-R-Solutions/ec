target-version = "py311"
line-length = 100
respect-gitignore = false
extend-exclude = ["**/.local", "**/.codex", "**/.agents", "**/node_modules", "**/target", "**/dist", "**/reverse_engineering_teamcity"]

[lint]
select = ["E9", "F63", "F7", "F82", "S"]
# Exceções somente por ocorrência revisada; triagem em docs/validation/tooling-remediation-20261106.

[lint.per-file-ignores]
# Asserts são o oráculo dos testes, não controles de autorização em produção.
"**/tests/**/*.py" = ["S101"]
