# Política Ec: todas as features; nenhuma exceção de advisory ou origem.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
confidence-threshold = 0.95
# União das licenças efetivamente usadas pelos dois grafos observados.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates privados do workspace usam path; registros externos continuam restritos.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Licença dos crates próprios Ec confirmada pelo usuário; dependências mantêm a política existente.

[[licenses.exceptions]]
name = "ec-contracts"
allow = ["GPL-3.0-only"]

