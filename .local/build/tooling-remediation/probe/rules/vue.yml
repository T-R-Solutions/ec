# Vue SFC: inspeção textual explícita; não equivale a parsing/taint TypeScript do SFC.
rules:
  - id: ec.vue.raw-html
    languages: [generic]
    paths:
      include: ['*.vue']
    severity: ERROR
    message: v-html interpreta conteúdo; revisar sanitização e origem. Saída de jobs deve usar interpolação textual.
    pattern-regex: '\bv-html\s*='
  - id: ec.vue.dynamic-eval
    languages: [generic]
    paths:
      include: ['*.vue']
    severity: ERROR
    message: Revisar interpretação dinâmica no script do componente.
    pattern-regex: '\beval\s*\('
